events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Used together with proxy_pass variables below so
    # nginx re-resolves each upstream's IP per-request instead of caching it
    # once at startup - otherwise a container restart (new IP) leaves nginx
    # stuck proxying to a dead address until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Raised so annexure uploads aren't rejected before they reach
    # meeting_service; keep this >= 10GB for per-meeting configured annexure limits.
    client_max_body_size 10g;

    # Hide nginx version fingerprinting
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        # Forward headers correctly for client requests
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Security Headers ---
        # Prevent browsers from MIME-sniffing a response from the declared content-type
        add_header X-Content-Type-Options "nosniff" always;
        # Prevent clickjacking via iframes
        add_header X-Frame-Options "DENY" always;
        # Control referrer information sent with requests
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Basic XSS protection for older browsers
        add_header X-XSS-Protection "1; mode=block" always;

        # Block access to Swagger API docs from external clients
        location /api-docs {
            allow 127.0.0.1;
            deny all;
            set $upstream http://auth_service:8000;
            proxy_pass $upstream;
        }

        location / {
            set $upstream http://frontend:3000;
            proxy_pass $upstream;
        }

        location /api/auth {
            set $upstream http://auth_service:8000;
            proxy_pass $upstream;
        }

        location /api/meetings {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/faculties {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/departments {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/offices {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/members {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/templates {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/agendas {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/tags {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/categories {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/search {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/audit-logs {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/notices {
            set $upstream http://meeting_service:8001;
            proxy_pass $upstream;
        }

        location /api/roles {
            set $upstream http://auth_service:8000;
            proxy_pass $upstream;
        }

        # File storage is proxied through meeting_service so authMiddleware
        # gates access instead of exposing the MinIO bucket directly.
        location /storage/ {
            set $upstream http://meeting_service:8001;
            # proxy_pass's automatic "replace the matched location prefix"
            # rewrite only happens when its target has no variables in it.
            # $upstream is a variable (needed for re-resolving DNS above),
            # so that rewrite never fires and nginx forwards the literal
            # `/api/storage/` path as-is, dropping the actual file key.
            # Rewriting the URI ourselves first sidesteps that.
            rewrite ^/storage/(.*)$ /api/storage/$1 break;
            proxy_pass $upstream;
        }

    }
}
